services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - DATA_DIR=/app/data
      - WATCHPACK_POLLING=true
    volumes:
      # live-edit the source from the host
      - .:/app
      # keep the container's own Linux-built node_modules (don't let the
      # macOS host bind mount shadow it)
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # the SQLite database and uploaded images persist on the host
      - ./data:/app/data

volumes:
  node_modules:
  next_cache:
